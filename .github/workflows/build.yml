name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The full desktop app (Electron). `--publish never`: electron-builder otherwise tries to publish a
  # release when it detects CI, and fails without a token.
  app-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx electron-builder --win --x64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: f1-telemetry-windows
          path: |
            dist/*.exe
          if-no-files-found: error

  app-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx electron-builder --mac --arm64 --x64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: f1-telemetry-macos
          path: |
            dist/*.dmg
          if-no-files-found: error

  # The tray/menu-bar widget (Tauri + Rust): built on both platforms so a Windows-only break shows up.
  widget:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: widget
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: widget/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: widget/src-tauri
      - run: npm ci
      - run: cargo test --manifest-path src-tauri/Cargo.toml --lib
      - run: npx tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: f1-widget-${{ matrix.os }}
          path: |
            widget/src-tauri/target/release/bundle/nsis/*.exe
            widget/src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error
