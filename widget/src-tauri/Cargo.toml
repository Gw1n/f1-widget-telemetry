[package]
name = "f1-widget"
version = "0.1.0"
edition = "2024"
description = "Lightweight F1 widget"

[lib]
name = "f1_widget_lib"
path = "src/lib.rs"

[[bin]]
name = "f1-widget"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", features = ["serde"] }
keyring = { version = "3", features = ["apple-native", "windows-native"] }
reqwest = { version = "0.13.5", features = ["json", "form"] }
rumqttc = { version = "0.25.1", features = ["use-rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "time", "sync"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
